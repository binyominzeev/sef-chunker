<!DOCTYPE html>
<html lang="hu" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sefaria Daily AI{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        .hebrew-text { font-family: 'David', 'Times New Roman', serif; font-size: 1.2rem; direction: rtl; text-align: right; line-height: 2; }
        .summary-box { background: var(--bs-secondary-bg); border-left: 4px solid var(--bs-primary); padding: 1rem; border-radius: 0.25rem; }
        .chunk-preview { max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-book-half me-1 text-primary"></i>Sefaria Daily AI</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/books/"><i class="bi bi-collection me-1"></i>Könyvek</a></li>
                <li class="nav-item"><a class="nav-link" href="/chunks/"><i class="bi bi-list-ol me-1"></i>Részletek</a></li>
                <li class="nav-item"><a class="nav-link" href="/prompt-lab/"><i class="bi bi-cpu me-1"></i>Prompt Lab</a></li>
                <li class="nav-item"><a class="nav-link" href="/settings/"><i class="bi bi-gear me-1"></i>Beállítások</a></li>
            </ul>
            <button class="btn btn-sm btn-outline-secondary" id="darkModeToggle" onclick="toggleDark()">
                <i class="bi bi-moon-stars-fill"></i>
            </button>
        </div>
    </div>
</nav>
<main class="container-fluid py-4">
    {% block content %}{% endblock %}
</main>
<footer class="border-top text-center text-muted py-3 small">Sefaria Daily AI &copy; 2025</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function toggleDark() {
    const html = document.documentElement;
    const current = html.getAttribute('data-bs-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-bs-theme', next);
    localStorage.setItem('theme', next);
}
(function() {
    const saved = localStorage.getItem('theme');
    if (saved) document.documentElement.setAttribute('data-bs-theme', saved);
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
